name: pothole_detection_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pillow
  - tqdm
  - pyyaml
  - pip:
      - torch>=2.0.0
      - torchvision>=0.15.0
      - torchaudio>=2.0.0
      - ultralytics>=8.0.0
      - opencv-python-headless
build:
  commands:
    - apt-get update && apt-get install -y libgl1-mesa-glx libglib2.0-0
