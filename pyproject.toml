[project]
name = "pothole-detection"
version = "0.1.0"
description = "YOLOv8 pothole detection trained on Azure ML"
requires-python = ">=3.10"

dependencies = [
    # ML / training
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
    # Azure ML job submission
    "azure-ai-ml>=1.12.0",
    "azure-identity>=1.15.0",
    # Azure Blob Storage (data upload / download)
    "azure-storage-blob>=12.19.0",
    # Config
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = []
